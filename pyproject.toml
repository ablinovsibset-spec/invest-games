[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invest-games"
version = "0.1.0"
description = "Переговоры Основателя с Инвестором: Jev решает, LLM говорит"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "jev>=0.3",
    "jinja2>=3.1",
    "openai>=1.40",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "typesafe-sdk>=0.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pyright>=1.1", "pytest>=8"]

[project.scripts]
invest-games = "invest_games.cli:main"
invest-games-web = "invest_games.web:main"

[tool.hatch.build.targets.wheel.force-include]
"src/invest_games/templates" = "invest_games/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
